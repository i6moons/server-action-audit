name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: |
          node dist/cli.js test/fixtures/next-app --json > report.json || true
          node -e "const r=require('./report.json'); if (r.summary.unprotected !== 2) process.exit(1)"

  # Temporary: checks --pr-comment against the real API on this pull request
  e2e-action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm pack
      - uses: ./
        with:
          path: test/fixtures/next-app
          fail-on: never
          comment: true
          version: file:${{ github.workspace }}/server-action-audit-0.2.0.tgz

  e2e-read-only:
    if: github.event_name == 'pull_request'
    needs: e2e-action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: sed -i 's/deletePost/removePost/' test/fixtures/next-app/app/\(dashboard\)/posts/actions.ts
      - run: node dist/cli.js test/fixtures/next-app --fail-on never --pr-comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
