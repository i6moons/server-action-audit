name: Server Action Audit
description: Find Next.js Server Actions without an authorization check, as annotations on your pull requests.
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Directory of the Next.js app.
    default: .
  fail-on:
    description: unprotected, unvalidated or never.
    default: unprotected
  version:
    description: Version of server-action-audit from npm.
    default: latest
  comment:
    description: Also post the report as a comment on the pull request, updated on every push. The job needs `pull-requests write` permission.
    default: 'false'
  github-token:
    description: Token used to post the comment.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Audit Server Actions
      shell: bash
      env:
        AUDIT_PATH: ${{ inputs.path }}
        AUDIT_FAIL_ON: ${{ inputs.fail-on }}
        AUDIT_VERSION: ${{ inputs.version }}
        AUDIT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=("${AUDIT_PATH}" --format github --fail-on "${AUDIT_FAIL_ON}")
        if [ "${AUDIT_COMMENT}" = "true" ]; then args+=(--pr-comment); fi
        npx --yes "server-action-audit@${AUDIT_VERSION}" "${args[@]}"
